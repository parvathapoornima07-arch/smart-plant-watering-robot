# Netlify configuration for the Smart Plant Watering Robot frontend.
# Deploy from the repo root with base directory = "frontend" in Netlify UI,
# or import the whole repo and Netlify will read this file automatically.

[build]
  # The frontend lives in the `frontend/` directory of the monorepo.
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite exposes only VITE_-prefixed vars to the browser bundle.
  # Set VITE_API_BASE_URL, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY in the
  # Netlify dashboard (Site settings > Environment variables). Do NOT put
  # backend secrets here.

# SPA fallback: let React Router own client-side routing on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache immutable built assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
